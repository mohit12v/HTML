<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list</title>
  </head>
  <body>
    <!-- oder-list -->

    <ol>
      <li>list - 1</li>
      <li>list - 2</li>
      <li>list - 3</li>
      <li>list - 4</li>
    </ol>

    <!-- now with attribute -->

    <ol type="a">
      <li>list-1</li>
      <li>list-2</li>
      <li>list-4</li>
    </ol>

    <!-- un-oderlist -->

    <ul>
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
    </ul>

    <!-- description-list -->
     <dl>
        <dt>vegetebles</dt>
        <dd>tometo</dd>
        <dd>potato</dd>
        <dd>caret</dd>
        <dd>loki</dd>
     </dl>
  </body>
</html>
